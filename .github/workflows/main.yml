name: Build MKamuy Location APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Mklocation-Android-Project-v4.zip'
      - '.github/workflows/main.yml'

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout files
        uses: actions/checkout@v4
      - name: Extract Android project
        run: |
          mkdir -p "$RUNNER_TEMP/mklocation"
          test -f Mklocation-Android-Project-v4.zip || { echo "Missing Mklocation-Android-Project-v4.zip in repo root"; exit 1; }
          unzip -q Mklocation-Android-Project-v4.zip -d "$RUNNER_TEMP/mklocation"
          test -f "$RUNNER_TEMP/mklocation/settings.gradle"
          echo "PROJECT_DIR=$RUNNER_TEMP/mklocation" >> "$GITHUB_ENV"
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle --no-daemon --console=plain :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mklocation-debug-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
